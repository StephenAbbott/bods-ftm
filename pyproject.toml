[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bods-ftm"
version = "0.1.0"
description = "Bidirectional converter between Beneficial Ownership Data Standard (BODS) v0.4 and the FollowTheMoney data model used by OpenSanctions and OpenAleph"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Stephen Abbott Pugh"},
]
dependencies = [
    "click>=8.1",
    # >=4.11.3 for the Control schema (4.11.0) and cikCode on LegalEntity /
    # irsCode as a US EIN on Organization (4.11.3). FtM requires Python 3.11
    # since 4.10.1. All FtM 4.x require normality 3.x, which hard-depends on
    # pyicu (source-only build: needs g++/libicu-dev/pkg-config).
    "followthemoney>=4.11.3,<5",
    # Used directly by ftm_to_bods (country/jurisdiction lookups); previously
    # only present by accident of the local environment - declare it explicitly.
    "pycountry>=22.3",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "bods-v04-fixtures>=0.1.1,<0.2",
    "pytest-bods-v04-fixtures>=0.1.1,<0.2",
]

[project.scripts]
bods-ftm = "bods_ftm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
